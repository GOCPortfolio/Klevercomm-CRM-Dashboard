<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f6f4f3;--card:#fff;--ink:#1b1414;--mut:#6f6663;--line:#e9e3e1;--red:#e10600;--red2:#fde7e5;--blk:#111;--ok:#1a8f5a;--okb:#e0f5ea;--wn:#b36b00;--wnb:#fff1d9;--bd:#c4160d;--bdb:#fde7e5;--sb:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141010;--card:#1e1918;--ink:#f4eeec;--mut:#a99e9b;--line:#322a28;--red2:#3a1512;--okb:#12301f;--wnb:#33250c;--bdb:#3a1512;--sb:#1a1514}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
aside{width:232px;background:var(--sb);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0}
aside img.lg{display:block;width:100%;height:auto;object-fit:contain;background:#fff;border-radius:10px;padding:10px 8px;margin-bottom:18px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--mut);margin-bottom:2px}
nav button:hover{background:var(--bg)}nav button.on{background:var(--red);color:#fff}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:13px}.me small{color:var(--mut);display:block}
main{flex:1;min-width:0;padding:24px 28px}
h1{font-size:24px;margin:0 0 2px;font-weight:800}h2{font-size:16px;margin:0 0 12px;font-weight:700}
.sub{color:var(--mut);margin-bottom:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.two{grid-template-columns:3fr 2fr}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.k{color:var(--mut);font-size:12px;font-weight:600}.v{font-size:22px;font-weight:800;margin-top:2px}.card.alert .v{color:var(--red)}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.s{padding:4px 10px;font-size:12px}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th{text-align:left;font-size:12px;color:var(--mut);padding:8px;border-bottom:1px solid var(--line);cursor:default}td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg);color:var(--mut)}
.b.ok{background:var(--okb);color:var(--ok)}.b.wn{background:var(--wnb);color:var(--wn)}.b.bd{background:var(--bdb);color:var(--bd)}
.bar{display:grid;grid-template-columns:130px 1fr 90px;gap:8px;align-items:center;margin:9px 0;cursor:pointer}.bar i{display:block;height:14px;border-radius:7px;background:var(--red)}.bar:nth-child(odd) i{background:var(--blk)}
.bar span:last-child{text-align:right;font-weight:700}.trk{background:var(--bg);border-radius:7px}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:var(--card);border-radius:16px;padding:20px;width:440px;max-width:100%;max-height:90vh;overflow:auto}
.md label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 3px}.md input,.md select,.md textarea{width:100%}
.err{color:var(--bd);font-size:13px;margin-top:8px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--blk);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:80vw}
.empty{padding:24px;text-align:center;color:var(--mut)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth .card{width:380px;max-width:100%;padding:26px}.auth img{display:block;width:100%;height:auto;object-fit:contain;margin-bottom:12px}.auth input{width:100%;margin-bottom:10px}
.mb{display:none}
@media(max-width:820px){aside{position:fixed;left:-250px;z-index:15;transition:left .2s}aside.open{left:0}main{padding:16px}.mb{display:inline-block}.two{grid-template-columns:1fr}.bar{grid-template-columns:90px 1fr 70px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="root"></div>

 o.innerHTML=`<div class="md" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${fields.map(f=>`<label for="f_${f.k}">${f.l}</label>${f.t==='select'?`<select id="f_${f.k}">${f.o.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(v)}" ${init[f.k]==v?'selected':''}>${esc(l)}</option>`}).join('')}</select>`:f.t==='area'?`<textarea id="f_${f.k}" rows="3">${esc(init[f.k]||'')}</textarea>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(init[f.k]??'')}">`}`).join('')}<div class="err" id="me"></div>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn g" id="x">Cancel</button><button class="btn" id="s">Save</button></div></div>`;
 document.body.append(o);o.querySelector('#x').onclick=()=>o.remove();o.addEventListener('click',e=>e.target===o&&o.remove());
 o.querySelector('#s').onclick=()=>{const d={};for(const f of fields){d[f.k]=o.querySelector('#f_'+f.k).value;if(f.t==='number')d[f.k]=+d[f.k];if(f.req&&(d[f.k]===''||d[f.k]!==d[f.k])){o.querySelector('#me').textContent=f.l+' is required.';return}}
  const er=ok(d);if(er)o.querySelector('#me').textContent=er;else{o.remove();save();render()}};o.querySelector('input,select')?.focus()}
function table(cols,rows,empty){return rows.length?`<div class="wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">${empty}</div>`}
const head=(t,s,btn='')=>`<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div><div>${btn}</div></div>`;
const cards=a=>`<div class="grid cards">${a.map(([k,v,al])=>`<div class="card ${al?'alert':''}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>`;
const inRange=(d,p)=>{if(p==='all')return true;const n=new Date(),t=new Date(d+'T00:00');
 if(p==='today')return d===today();if(p==='week'){const s=new Date(n);s.setDate(n.getDate()-((n.getDay()+6)%7));s.setHours(0,0,0,0);return t>=s}
 if(p==='month')return d.slice(0,7)===today().slice(0,7);if(p==='quarter')return t.getFullYear()===n.getFullYear()&&Math.floor(t.getMonth()/3)===Math.floor(n.getMonth()/3);
 return d.slice(0,4)===today().slice(0,4)};
function csv(name,head,rows){if(!guard(can.staff()))return;const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const b=new Blob([[head,...rows].map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();log('Data export',name);save()}

 const E=db.enrs,F=E.map(e=>({e,f:fin(e)})),collected=db.pays.reduce((s,p)=>s+(p.type==='refund'?-p.amt:p.amt),0),
 out=F.reduce((s,x)=>s+x.f.bal,0),od=F.reduce((s,x)=>s+x.f.od,0);

 const M={enr:'Most enrolled',val:'Highest enrollment value',rev:'Highest collected revenue',lead:'Most popular by leads',conv:'Best lead-to-enrollment conversion'};

 v.innerHTML=head('Dashboard','Hello, '+esc(me.name.split(' ')[0])+'. Today is '+fd(today())+'.')+cards([['Total students',db.students.filter(s=>!s.archived).length],['Active students',new Set(E.filter(e=>{const c=db.classes.find(c=>c.id===e.cls);return c&&c.status==='Ongoing'}).map(e=>e.stu)).size],['New leads',db.leads.filter(l=>l.status==='New Lead').length],['Ongoing trainings',db.classes.filter(c=>c.status==='Ongoing').length],['Revenue collected',money(collected)],['Outstanding balances',money(out)],['Overdue payments',money(od),od>0],['Courses available',db.courses.filter(c=>c.status==='Active').length],...(can.admin()?[['Staff in today',SA.filter(r=>r.day===bizToday()&&r.in_at).length+' / '+db.users.filter(u=>!u.disabled).length]]:[])])+

 <div class="card"><h2>Needs attention</h2>${hold.length?hold.map(c=>`<div style="margin-bottom:6px">${badge('On Hold')} ${esc(c.name)}</div>`).join(''):'<div class="sub">No classes on hold.</div>'}<h2 style="margin-top:14px">Overdue accounts</h2>${odl.length?odl.map(x=>`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>${esc(sname(stu(x.e.stu)))}</span><b style="color:var(--bd)">${money(x.f.od)}</b></div>`).join(''):'<div class="sub">Nothing overdue.</div>'}</div></div>
 <div class="grid two" style="margin-top:14px"><div class="card"><h2>Upcoming sessions</h2>${table(['Class','Starts','Instructor'],db.classes.filter(c=>c.start>=today()&&c.status!=='Cancelled').sort((a,b)=>a.start>b.start?1:-1).slice(0,5).map(c=>[esc(c.name),fd(c.start),esc(usr(c.instructor)?.name)]),'No upcoming classes.')}</div>
 <div class="card"><h2>Recent activity</h2>${db.logs.slice(0,6).map(l=>`<div style="margin-bottom:6px"><b>${esc(l.a)}</b> <span class="sub">${esc(l.d)} · ${esc(l.by)}</span></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div></div>`}
function idash(v){const mine=db.classes.filter(c=>c.instructor===me.id),ids=new Set(db.enrs.filter(e=>mine.some(c=>c.id===e.cls)).map(e=>e.stu));
 v.innerHTML=head('Welcome, '+esc(me.name.split(' ')[0]),'You see only the classes assigned to you.')+cards([['My classes',mine.length],['Active',mine.filter(c=>c.status==='Ongoing').length],['Upcoming',mine.filter(c=>c.status==='Scheduled').length],['Completed',mine.filter(c=>c.status==='Completed').length],['My students',ids.size]])+`<div class="card"><h2>My classes</h2>${classTable(mine)}</div>`}

 v.innerHTML=head('Classes & Training',me.role==='instructor'?'Your assigned classes.':'Schedule cohorts, assign instructors and track status.',can.admin()?'<button class="btn" onclick="newClass()">New class</button>':'')+`<div class="card">${classTable(l)}</div>`}
function newClass(){if(!guard(can.admin()))return;const ins=db.users.filter(u=>u.role==='instructor');
 modal('New class',[{k:'name',l:'Class name',req:1},{k:'course',l:'Course',t:'select',o:db.courses.filter(c=>c.status==='Active').map(c=>[c.id,c.name])},{k:'instructor',l:'Instructor',t:'select',o:ins.map(u=>[u.id,u.name])},{k:'start',l:'Start date',t:'date',req:1},{k:'end',l:'End date',t:'date',req:1},{k:'fmt',l:'Format',t:'select',o:['Online','In-Person','Hybrid']},{k:'link',l:'Meeting link'}],d=>{
  if(!ins.length)return'Add an instructor first.';if(d.end<d.start)return'End date must be after the start date.';

  const c={id:uid('CL'),...d,status:'Scheduled',notes:'',hist:[]};db.classes.push(c);log('Class created',c.name);notify(c.instructor,'You were assigned to '+c.name);toast('Class created')})}
function setStatus(id){const c=db.classes.find(x=>x.id===id);if(!guard(c&&can.cls(c)))return;
 modal('Update status: '+c.name,[{k:'st',l:'New status',t:'select',o:['Scheduled','Ongoing','On Hold','Completed']},{k:'why',l:'Reason (optional)',t:'area'}],d=>{

 $('#v').innerHTML=head(esc(c.name),esc(crs(c.course)?.name)+' · '+badge(c.status).replace(/<[^>]+>/g,'')+' · '+fd(c.start)+' to '+fd(c.end),`<button class="btn g" onclick="render()">Back</button>`)+`<div class="grid two"><div class="card"><h2>Roster</h2>${table(['Student','Email','Phone',...(can.money()?['Balance']:[])],es.map(e=>{const s=stu(e.stu);return[esc(sname(s)),esc(s.email),esc(s.phone),...(can.money()?[money(bal(e))]:[])]}),'No students assigned to this class yet.')}</div>
 <div class="card"><h2>Status history</h2>${c.hist.length?c.hist.map(h=>`<div style="margin-bottom:8px"><b>${esc(h.from)} → ${esc(h.to)}</b><div class="sub">${esc(h.by)} · ${new Date(h.at).toLocaleString('en-GB')}${h.why?'<br>'+esc(h.why):''}</div></div>`).join(''):'<div class="empty">No status changes yet.</div>'}
 <h2 style="margin-top:14px">Class notes</h2><textarea id="cn" rows="3" style="width:100%">${esc(c.notes)}</textarea><button class="btn s" style="margin-top:6px" onclick="saveNote('${c.id}')">Save notes</button></div></div>`+attCard(c,es)}


/* ---------- staff attendance: clock in / out (times are stamped by the server) ---------- */
let SA=[],CFG={work_start:'09:00',grace_min:'15',work_end:'17:00',tz:'Africa/Lagos'};
async function loadClock(){const from=new Date(Date.now()-90*864e5).toISOString().slice(0,10);
 const a=await sb.from('staff_att').select('*').gte('day',from).order('day',{ascending:false}).limit(5000);SA=a.error?[]:a.data;
 const c=await sb.from('settings').select('*');if(!c.error)c.data.forEach(r=>CFG[r.key]=r.value)}
const bizToday=()=>new Date().toLocaleDateString('en-CA',{timeZone:CFG.tz});
const hm=iso=>iso?new Date(iso).toLocaleTimeString('en-GB',{timeZone:CFG.tz,hour:'2-digit',minute:'2-digit',hour12:false}):'—';
const mins=t=>{const[h,m]=t.split(':');return +h*60+ +m};
const lateMin=r=>{if(!r||!r.in_at)return 0;const a=mins(hm(r.in_at))-mins(CFG.work_start);return a>(+CFG.grace_min||0)?a:0};
const hrs=r=>r&&r.in_at&&r.out_at?Math.max(0,(new Date(r.out_at)-new Date(r.in_at))/36e5):null;
const fh=h=>h===null?'—':h.toFixed(1)+' h';
function sstat(r,d){if(r&&r.in_at){const l=lateMin(r);return l?['Late',l+' min late']:['On time','']}
 const w=new Date(d+'T12:00').getDay();if(w===0||w===6)return['Off',''];return[d<bizToday()?'Absent':'Not in yet','']}
const sbadge=([s,x])=>badge(s)+(x?` <span class="sub" style="font-size:12px">${x}</span>`:'');
function clockPage(v){const d=bizToday(),mine=SA.filter(r=>r.user_id===me.id),t=mine.find(r=>r.day===d),adm=can.admin();
 let h=head('Staff Attendance','Clock in when you arrive and out when you leave. The server records the time, so it can’t be changed from your device.',adm?'<button class="btn g" onclick="workHours()">Work hours</button>':'')+
 `<div class="grid two"><div class="card"><h2>Today · ${fd(d)}</h2>
 <div class="v" style="margin-bottom:6px">${t&&t.in_at?'In at '+hm(t.in_at):'Not clocked in'}</div>
 <div class="sub">${t&&t.in_at?sbadge(sstat(t,d))+(t.out_at?' · Last out '+hm(t.out_at)+' ('+fh(hrs(t))+')':' · Still at work'):'Work starts at '+esc(CFG.work_start)+' ('+esc(CFG.grace_min)+' min grace).'}</div>
 ${t?'':'<input id="cn_note" placeholder="Note (optional), e.g. at client site" style="width:100%;margin-bottom:10px">'}
 <div style="display:flex;gap:8px"><button class="btn" ${t?'disabled style="opacity:.5"':''} onclick="clk('in')">Clock in</button><button class="btn g" ${t?'':'disabled style="opacity:.5"'} onclick="clk('out')">Clock out</button></div></div>
 <div class="card"><h2>My last 14 days</h2>${table(['Date','In','Out','Hours','Status'],mine.filter(r=>r.in_at).slice(0,14).map(r=>[fd(r.day),hm(r.in_at),hm(r.out_at),fh(hrs(r)),sbadge(sstat(r,r.day))]),'No attendance recorded yet.')}</div></div>`;
 if(adm){const sd=flt.cd||d,us=db.users.filter(u=>!u.disabled).sort((a,b)=>a.name.localeCompare(b.name)),rows=us.map(u=>({u,r:SA.find(x=>x.user_id===u.id&&x.day===sd)}));
  const from=new Date(Date.now()-30*864e5).toLocaleDateString('en-CA',{timeZone:CFG.tz}),rec=SA.filter(r=>r.day>=from&&r.in_at);
  h+=`<div class="card" style="margin-top:14px"><div class="top"><h2>Team attendance</h2><div class="tb"><input type="date" value="${sd}" max="${d}" onchange="flt.cd=this.value||bizToday();render()" aria-label="Date"></div></div>
  ${cards([['Clocked in',rows.filter(x=>x.r&&x.r.in_at).length+' of '+us.length],['Late',rows.filter(x=>lateMin(x.r)).length,rows.some(x=>lateMin(x.r))],['Not in',rows.filter(x=>!(x.r&&x.r.in_at)&&!['Off'].includes(sstat(null,sd)[0])).length]])}
  ${table(['Name','Role','In','Out','Hours','Status','Note',''],rows.map(({u,r})=>[`<b>${esc(u.name)}</b>`,esc({admin:'Administrator',staff:'Staff',instructor:'Instructor'}[u.role]),hm(r&&r.in_at),hm(r&&r.out_at),fh(hrs(r)),sbadge(sstat(r,sd)),esc(r&&r.note||''),`<button class="btn s g" onclick="fixAtt('${u.id}','${sd}')">${r?'Correct':'Add'}</button>`]),'No users.')}</div>
  <div class="card" style="margin-top:14px"><div class="top"><h2>Last 30 days</h2><button class="btn g s" onclick="expClock()">Export CSV</button></div>${table(['Name','Days present','Late days','Avg arrival','Total hours'],us.map(u=>{const x=rec.filter(r=>r.user_id===u.id),avg=x.length?x.reduce((a,r)=>a+mins(hm(r.in_at)),0)/x.length:null;
   return[`<b>${esc(u.name)}</b>`,x.length,x.filter(lateMin).length,avg===null?'—':String(Math.floor(avg/60)).padStart(2,'0')+':'+String(Math.round(avg%60)).padStart(2,'0'),fh(x.reduce((a,r)=>a+(hrs(r)||0),0))]}),'No users.')}
  <p class="sub" style="font-size:12px;margin:10px 0 0">“Absent” means no clock-in on a weekday. Leave and public holidays aren’t tracked yet, so check before acting on it.</p></div>`}
 v.innerHTML=h}
async function clk(kind){const n=$('#cn_note');const r=kind==='in'?await sb.rpc('clock_in',{p_note:n?n.value:null}):await sb.rpc('clock_out');
 if(r.error)return toast(String(r.error.message).replace(/^.*?:\s*/,''));await loadClock();toast(kind==='in'?'Clocked in. Have a great day!':'Clocked out. See you next time!');render()}
function workHours(){if(!guard(can.admin()))return;modal('Work hours',[{k:'s',l:'Work starts',t:'time',req:1},{k:'g',l:'Grace period (minutes)',t:'number',req:1},{k:'e',l:'Work ends',t:'time',req:1}],x=>{
 if(x.g<0||x.g>120)return'Grace must be between 0 and 120 minutes.';if(x.e<=x.s)return'End time must be after the start time.';
 sb.from('settings').upsert([{key:'work_start',value:x.s},{key:'grace_min',value:String(x.g)},{key:'work_end',value:x.e}]).then(async r=>{if(r.error)return toast('Couldn’t save: '+r.error.message);await loadClock();log('Work hours changed',x.s+' / '+x.g+' min grace');save();toast('Work hours saved');render()})},{s:CFG.work_start,g:+CFG.grace_min,e:CFG.work_end})}
function fixAtt(uid_,d){if(!guard(can.admin()))return;const r=SA.find(x=>x.user_id===uid_&&x.day===d),u=usr(uid_);
 modal((r?'Correct: ':'Add: ')+u.name+' · '+fd(d),[{k:'i',l:'Clock-in time',t:'time',req:1},{k:'o',l:'Clock-out time (optional)',t:'time'},{k:'why',l:'Reason (required, kept on the record)',t:'area',req:1}],x=>{
  if(CFG.tz!=='Africa/Lagos')return'Corrections currently support the Africa/Lagos timezone only.';if(x.o&&x.o<=x.i)return'Clock-out must be after clock-in.';
  const iso=t=>t?d+'T'+t+':00+01:00':null;
  sb.from('staff_att').upsert({user_id:uid_,day:d,in_at:iso(x.i),out_at:iso(x.o),note:x.why,edited_by:me.id},{onConflict:'user_id,day'}).then(async q=>{if(q.error)return toast('Couldn’t save: '+q.error.message);await loadClock();log('Attendance corrected',u.name+' · '+fd(d)+' · '+x.why);save();toast('Attendance saved');render()})},
  {i:r&&r.in_at?hm(r.in_at):'',o:r&&r.out_at?hm(r.out_at):'',why:''})}
function expClock(){if(!guard(can.admin()))return;const from=new Date(Date.now()-30*864e5).toLocaleDateString('en-CA',{timeZone:CFG.tz});
 csv('staff-attendance.csv',['Name','Date','In','Out','Hours','Status','Note'],SA.filter(r=>r.day>=from&&r.in_at).map(r=>[usr(r.user_id)?.name,r.day,hm(r.in_at),hm(r.out_at),hrs(r)===null?'':hrs(r).toFixed(2),sstat(r,r.day)[0],r.note||'']))}
/* ---------- attendance (stored on the class; instructors mark their own classes, admins can mark any, staff view only) ---------- */
const AS=[['P','Present'],['L','Late'],['A','Absent'],['E','Excused']];
function attStats(c,es){const att=c.att||{},dates=Object.keys(att).sort();
 return es.map(e=>{const s=stu(e.stu),r=dates.map(d=>att[d][e.stu]).filter(Boolean),n=k=>r.filter(x=>x===k).length,got=n('P')+n('L');
  return{s,sessions:r.length,P:n('P'),L:n('L'),A:n('A'),E:n('E'),pct:r.length?Math.round(got/r.length*100):null}})}
function attCard(c,es){const att=c.att||{},dates=Object.keys(att).sort().reverse(),edit=me.role!=='staff'&&can.cls(c)&&c.status!=='Cancelled',
 maxD=c.end<today()?c.end:today(),d=flt.ad&&flt.ad>=c.start&&flt.ad<=maxD?flt.ad:maxD,cur=att[d]||{},ids=[...new Set(es.map(e=>e.stu))],st=attStats(c,[...new Map(es.map(e=>[e.stu,e])).values()]);
 const low=st.filter(x=>x.pct!==null&&x.pct<70&&x.sessions>=3);
 return`<div class="card" style="margin-top:14px"><div class="top"><h2>Attendance</h2>${can.staff()&&dates.length?`<button class="btn g s" onclick="expAtt('${c.id}')">Export CSV</button>`:''}</div>
 <div class="sub" style="font-size:12px">${dates.length} session${dates.length===1?'':'s'} recorded. “Attended” counts Present and Late; Excused sessions still count in the total.</div>
 ${low.length?`<div class="err" style="margin:0 0 10px">Low attendance (under 70%): ${low.map(x=>esc(sname(x.s))).join(', ')}</div>`:''}
 ${edit?(ids.length?`<div class="tb"><label for="ad" class="k" style="align-self:center">Session date</label><input id="ad" type="date" min="${c.start}" max="${maxD}" value="${d}" onchange="flt.ad=this.value;clsView('${c.id}')">${att[d]?badge('Already recorded'):''}</div>
 ${table(['Student','Status'],ids.map(id=>[esc(sname(stu(id))),`<select id="at_${id}" aria-label="Attendance for ${esc(sname(stu(id)))}">${AS.map(([k,l])=>`<option value="${k}" ${(cur[id]||'P')===k?'selected':''}>${l}</option>`).join('')}</select>`]),'')}
 <button class="btn" style="margin-top:10px" onclick="saveAtt('${c.id}')">Save attendance</button>`:'<div class="empty">Add students to this class before recording attendance.</div>'):'<div class="sub">Only the assigned instructor or an administrator can record attendance.</div>'}
 <h2 style="margin-top:18px">Summary</h2>${table(['Student','Sessions','Present','Late','Absent','Excused','Attendance'],st.map(x=>[esc(sname(x.s)),x.sessions,x.P,x.L,x.A,x.E,x.pct===null?'—':x.pct+'%']),'No students yet.')}
 ${dates.length?`<h2 style="margin-top:18px">Recorded sessions</h2><div>${dates.map(x=>`<span class="b" style="margin:0 6px 6px 0">${fd(x)}</span>`).join('')}</div>`:''}</div>`}
function saveAtt(id){const c=db.classes.find(x=>x.id===id);if(!guard(c&&me.role!=='staff'&&can.cls(c)))return;
 const d=$('#ad').value,maxD=c.end<today()?c.end:today();
 if(!d)return toast('Pick a session date.');if(d<c.start||d>maxD)return toast('Date must be between the class start and today (or the class end).');
 if(c.status==='Cancelled')return toast('This class is cancelled.');
 const was=!!(c.att&&c.att[d]);if(was&&!confirm('Attendance for '+fd(d)+' is already recorded. Replace it?'))return;
 const rec={};[...new Set(db.enrs.filter(e=>e.cls===id).map(e=>e.stu))].forEach(sid=>rec[sid]=$('#at_'+sid).value);
 c.att=c.att||{};c.att[d]=rec;c.attBy=c.attBy||{};c.attBy[d]={by:me.name,at:new Date().toISOString()};
 log(was?'Attendance updated':'Attendance recorded',c.name+' · '+fd(d));save();toast('Attendance saved');clsView(id)}
function expAtt(id){const c=db.classes.find(x=>x.id===id);if(!guard(c&&can.staff()))return;const att=c.att||{},dates=Object.keys(att).sort(),ids=[...new Set(db.enrs.filter(e=>e.cls===id).map(e=>e.stu))];
 csv('attendance-'+c.name.replace(/\W+/g,'-')+'.csv',['Student',...dates],ids.map(sid=>[sname(stu(sid)),...dates.map(d=>({P:'Present',L:'Late',A:'Absent',E:'Excused'}[att[d][sid]]||''))]))}
function saveNote(id){const c=db.classes.find(x=>x.id===id);if(!guard(can.cls(c)))return;c.notes=$('#cn').value;log('Class notes',c.name);save();toast('Notes saved')}
/* ---------- students ---------- */
function students(v){const q=(flt.q||'').toLowerCase();
 const rows=db.students.filter(s=>!s.archived===!flt.arch||false).filter(s=>{const es=db.enrs.filter(e=>e.stu===s.id);return(!flt.c||es.some(e=>e.course===flt.c))&&(!q||(sname(s)+s.email+s.id).toLowerCase().includes(q))});
 v.innerHTML=head('Students','Every student, their enrollments and balances.',`<button class="btn g" onclick="expStu()">Export CSV</button> <button class="btn" onclick="newStu()">Add student</button>`)+
 `<div class="tb"><input placeholder="Search name, email or ID" value="${esc(flt.q||'')}" oninput="flt.q=this.value;clearTimeout(window.t);window.t=setTimeout(()=>{students($('#v'));$('#v input').focus()},250)"><select onchange="flt.c=this.value;render()"><option value="">All courses</option>${db.courses.map(c=>`<option value="${c.id}" ${flt.c===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="btn g" onclick="flt.arch=!flt.arch;render()">${flt.arch?'Show active':'Show archived'}</button></div>
 <div class="card">${table(['ID','Name','Email','Mobile','Course(s)','Instructor','Training','Payment','Balance',''],rows.map(s=>{const es=db.enrs.filter(e=>e.stu===s.id),e=es[0],c=e&&db.classes.find(x=>x.id===e.cls);
  return[s.id,`<b>${esc(sname(s))}</b>`,esc(s.email),esc(s.phone),esc(es.map(e=>crs(e.course)?.name).join(', ')||'—'),esc(usr(c?.instructor)?.name||'—'),c?badge(c.status):badge('Not Scheduled'),es.length?badge(fin(e).st):'—',money(es.reduce((a,e)=>a+bal(e),0)),`<button class="btn s g" onclick="stuView('${s.id}')">View</button> <button class="btn s g" onclick="arch('${s.id}')">${s.archived?'Restore':'Archive'}</button>`]}),'No students match. Try clearing filters or add a student.')}</div>`}
function expStu(){csv('students.csv',['ID','First','Last','Email','Phone','Courses','Balance'],db.students.map(s=>{const es=db.enrs.filter(e=>e.stu===s.id);return[s.id,s.first,s.last,s.email,s.phone,es.map(e=>crs(e.course)?.name).join('; '),es.reduce((a,e)=>a+bal(e),0)]}))}
function newStu(){if(!guard(can.staff()))return;modal('Add student',[{k:'first',l:'First name',req:1},{k:'last',l:'Last name',req:1},{k:'email',l:'Email',t:'email',req:1},{k:'phone',l:'Mobile (with country code, e.g. +234…)',req:1},{k:'src',l:'Lead source'}],d=>{
  if(!/^\S+@\S+\.\S+$/.test(d.email))return'Enter a valid email.';if(!/^\+\d{7,15}$/.test(d.phone.replace(/\s/g,'')))return'Phone must start with + and a country code.';
  if(db.students.some(s=>s.email===d.email.toLowerCase()))return'A student with this email already exists.';
  const s={id:uid('STU'),...d,email:d.email.toLowerCase(),created:today(),archived:false};db.students.push(s);log('Student created',sname(s));toast('Student added')})}
function arch(id){if(!guard(can.staff()))return;const s=stu(id);s.archived=!s.archived;log(s.archived?'Student archived':'Student restored',sname(s));save();render()}
function enrol(sid,lead){if(!guard(can.staff()))return;modal('Enrol in a course',[{k:'course',l:'Course',t:'select',o:db.courses.filter(c=>c.status==='Active').map(c=>[c.id,c.name])},{k:'cls',l:'Class',t:'select',o:[['','Not assigned yet'],...db.classes.map(c=>[c.id,c.name])]},{k:'disc',l:'Discount',t:'number'},{k:'plan',l:'Payment plan',t:'select',o:['Full Payment','Deposit + Balance','Installments','Custom Plan']},{k:'n',l:'Number of installments (if applicable)',t:'number'}],d=>{
  const c=crs(d.course);if(d.disc<0||d.disc>c.price)return'Discount must be between 0 and the course price.';
  if(db.enrs.some(e=>e.stu===sid&&e.course===d.course&&e.cls===d.cls&&d.cls))return'This student is already in that class for this course.';
  const n=c.price-(d.disc||0),k=d.plan==='Full Payment'?1:Math.max(2,d.n||2);
  const e={id:uid('E'),stu:sid,course:d.course,cls:d.cls,fee:c.price,disc:d.disc||0,plan:d.plan,date:today(),status:'Enrolled',inst:Array.from({length:k},(_,j)=>{const dt=new Date();dt.setMonth(dt.getMonth()+j);return{n:j+1,amt:Math.round(n/k),due:dt.toISOString().slice(0,10)}})};
  db.enrs.push(e);log('Enrolment',sname(stu(sid))+' → '+c.name);if(d.cls)notify(db.classes.find(x=>x.id===d.cls).instructor,'New student in your class');toast('Enrolled. Fee is locked at '+money(c.price))})}
function stuView(id){const s=stu(id),es=db.enrs.filter(e=>e.stu===id);
 $('#v').innerHTML=head(esc(sname(s)),s.id+' · '+esc(s.email)+' · '+esc(s.phone),`<button class="btn g" onclick="render()">Back</button> <button class="btn" onclick="enrol('${id}')">Enrol in course</button>`)+
 (es.length?es.map(e=>{const f=fin(e),c=db.classes.find(x=>x.id===e.cls);return`<div class="card" style="margin-bottom:12px"><div class="top"><h2>${esc(crs(e.course)?.name)}</h2>${badge(f.st)}</div><div class="sub">${c?esc(c.name)+' · '+esc(usr(c.instructor)?.name)+' · '+fd(c.start)+' to '+fd(c.end):'<span style="color:var(--wn)">Not assigned to a class yet</span>'} · Enrolled ${fd(e.date)} · ${esc(e.plan)}</div>
 ${cards([['Final amount',money(f.net)],['Paid',money(f.paid)],['Outstanding',money(f.bal)],['Overdue',money(f.od),f.od>0],['Next due',fd(f.next)],['Complete',f.pct+'%']])}${table(['#','Due','Amount'],e.inst.map(i=>[i.n,fd(i.due),money(i.amt)]),'')}${can.money()?`<button class="btn s" style="margin-top:8px" onclick="recPay('${e.id}')">Record payment</button>`:''}</div>`}).join(''):'<div class="card empty">No enrolments yet. Use “Enrol in course” to start.</div>')}
/* ---------- leads ---------- */
const LS=['New Lead','Contacted','Interested','Enrolled','Deferred','Withdrawn'];
function leads(v){v.innerHTML=head('Leads & Prospects','Follow up and convert prospects into students.','<button class="btn" onclick="newLead()">Add lead</button>')+
 `<div class="grid cards">${LS.slice(0,4).map(s=>`<div class="card"><div class="k">${s}</div><div class="v">${db.leads.filter(l=>l.status===s).length}</div></div>`).join('')}</div><div class="card">${table(['ID','Name','Course','Source','Status','Follow-up',''],db.leads.map(l=>[l.id,esc(l.name),esc(crs(l.course)?.name),esc(l.src),badge(l.status),l.follow<today()&&!l.conv?`<b style="color:var(--bd)">${fd(l.follow)} (due)</b>`:fd(l.follow),l.conv?'Converted':`<select onchange="lStat('${l.id}',this.value)">${LS.slice(0,3).map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('')}</select> <button class="btn s" onclick="conv('${l.id}')">Convert</button>`]),'No leads yet.')}</div>`}
function lStat(id,s){const l=db.leads.find(x=>x.id===id);l.status=s;log('Lead status',l.name+' → '+s);save();render()}
function newLead(){if(!guard(can.staff()))return;modal('Add lead',[{k:'name',l:'Full name',req:1},{k:'course',l:'Course of interest',t:'select',o:db.courses.map(c=>[c.id,c.name])},{k:'src',l:'Source'},{k:'follow',l:'Follow-up date',t:'date'}],d=>{db.leads.push({id:uid('LD'),...d,date:today(),status:'New Lead',staff:me.id,conv:false,follow:d.follow||day(3)});log('Lead added',d.name);toast('Lead added')})}
function conv(id){if(!guard(can.staff()))return;const l=db.leads.find(x=>x.id===id);if(l.conv)return;
 modal('Convert '+l.name,[{k:'email',l:'Email',t:'email',req:1},{k:'phone',l:'Mobile (+country code)',req:1}],d=>{
  if(db.students.some(s=>s.email===d.email.toLowerCase()))return'A student with this email already exists.';
  const[f,...r]=l.name.split(' '),s={id:uid('STU'),first:f,last:r.join(' ')||'-',email:d.email.toLowerCase(),phone:d.phone,src:l.src,created:today(),archived:false};
  db.students.push(s);l.conv=true;l.status='Enrolled';log('Lead converted',l.name);toast('Converted. Now enrol them in a course.')})}
/* ---------- courses ---------- */
function courses(v){v.innerHTML=head('Courses','Catalog and per-course performance.',can.admin()?'<button class="btn" onclick="newCourse()">Add course</button>':'')+`<div class="card">${table(['Course','Price','Leads','Enrolled','Collected','Outstanding','Status',''],db.courses.map(c=>{const es=db.enrs.filter(e=>e.course===c.id);return[`<b>${esc(c.name)}</b>`,money(c.price),db.leads.filter(l=>l.course===c.id).length,es.length,money(es.reduce((a,e)=>a+fin(e).paid,0)),money(es.reduce((a,e)=>a+bal(e),0)),badge(c.status),can.admin()?`<button class="btn s g" onclick="editPrice('${c.id}')">Edit price</button> <button class="btn s g" onclick="togC('${c.id}')">${c.status==='Active'?'Archive':'Restore'}</button>`:'']}),'No courses yet.')}</div><p class="sub">Changing a price never alters fees on existing enrolments.</p>`}
function newCourse(){if(!guard(can.admin()))return;modal('Add course',[{k:'name',l:'Course name',req:1},{k:'price',l:'Standard price',t:'number',req:1},{k:'dur',l:'Duration'}],d=>{if(d.price<=0)return'Price must be above zero.';db.courses.push({id:uid('C'),...d,status:'Active',cat:'Training',fmt:'Online'});log('Course created',d.name);toast('Course added')})}
function editPrice(id){if(!guard(can.admin()))return;const c=crs(id);modal('Price: '+c.name,[{k:'price',l:'New standard price',t:'number',req:1}],d=>{if(d.price<=0)return'Price must be above zero.';log('Price change',c.name+': '+c.price+' → '+d.price);c.price=d.price},c)}
function togC(id){if(!guard(can.admin()))return;const c=crs(id);c.status=c.status==='Active'?'Archived':'Active';log('Course '+c.status.toLowerCase(),c.name);save();render()}
/* ---------- instructors, payments, notes, logs ---------- */
function instructors(v){if(!guard(can.admin()))return;
 v.innerHTML=head('Team & Instructors','Workload, roles and access.','<button class="btn" onclick="newUser()">Add user</button>')+`<div class="card">${table(['Name','Email','Role','Classes','Active','Students','Access'],db.users.map(u=>{const c=db.classes.filter(x=>x.instructor===u.id);const self=u.id===me.id;
  return[`<b>${esc(u.name)}</b> <button class="btn s g" onclick="editName('${u.id}')" aria-label="Edit name">Edit</button>`,esc(u.email),self?'Administrator':`<select onchange="setRole('${u.id}',this.value)" aria-label="Role">${[['admin','Administrator'],['staff','Staff'],['instructor','Instructor']].map(([r,l])=>`<option value="${r}" ${u.role===r?'selected':''}>${l}</option>`).join('')}</select>`,c.length,c.filter(x=>x.status==='Ongoing').length,new Set(db.enrs.filter(e=>c.some(x=>x.id===e.cls)).map(e=>e.stu)).size,self?'—':`<button class="btn s g" onclick="setActive('${u.id}')">${u.disabled?'Enable':'Disable'}</button>`]}),'No users yet.')}</div>`}
function editName(id){if(!guard(can.admin()))return;const u=usr(id);
 modal('Edit name',[{k:'name',l:'Full name as it should appear',req:1}],d=>{const n=d.name.trim().replace(/\s+/g,' ');if(n.length<2||n.length>60)return'Enter a name between 2 and 60 characters.';
  sb.from('profiles').update({name:n}).eq('id',id).select('id').then(r=>{if(r.error||!r.data.length)return toast('Couldn’t save that name.');log('Name changed',u.name+' → '+n);u.name=n;save();toast('Name updated');render()})},{name:u.name})}
function newUser(){if(!guard(can.admin()))return;alert('To add someone: in Supabase open Authentication → Users → Add user (set their email and a temporary password). They appear here as Instructors; change their role if needed.')}
async function setRole(id,role){if(!guard(can.admin()))return;const r=await sb.from('profiles').update({role}).eq('id',id).select('id');
 if(r.error||!r.data.length)return toast('Couldn’t change that role.');const u=usr(id);u.role=role;log('Role change',u.name+' → '+role);save();toast('Role updated');render()}
async function setActive(id){if(!guard(can.admin()))return;const u=usr(id),disabled=!u.disabled,r=await sb.from('profiles').update({disabled}).eq('id',id).select('id');
 if(r.error||!r.data.length)return toast('Couldn’t update access.');u.disabled=disabled;log(disabled?'User disabled':'User enabled',u.name);save();render()}
function pay(v){if(!guard(can.money()))return;const F=db.enrs.map(e=>({e,f:fin(e)}));
 v.innerHTML=head('Payments & Finance','Only recorded payments count as money received. Installment schedules are plans, not income.','<button class="btn g" onclick="expPay()">Export CSV</button>')+cards([['Enrollment value',money(F.reduce((a,x)=>a+x.f.net,0))],['Collected',money(F.reduce((a,x)=>a+x.f.paid,0))],['Outstanding',money(F.reduce((a,x)=>a+x.f.bal,0))],['Overdue',money(F.reduce((a,x)=>a+x.f.od,0)),1]])+
 `<div class="card" style="margin-bottom:14px"><h2>Enrolments</h2>${table(['Student','Course','Final','Paid','Balance','Next due','Status',''],F.map(({e,f})=>[esc(sname(stu(e.stu))),esc(crs(e.course)?.name),money(f.net),money(f.paid),money(f.bal),fd(f.next),badge(f.st),`<button class="btn s" onclick="recPay('${e.id}')">Record payment</button>`]),'No enrolments yet.')}</div>
 <div class="card"><h2>Payment history</h2>${table(['Date','Student','Amount','Method','Reference','Entered by','Type'],[...db.pays].sort((a,b)=>a.date<b.date?1:-1).map(p=>{const e=db.enrs.find(x=>x.id===p.enr);return[fd(p.date),esc(sname(stu(e?.stu))),(p.type==='refund'?'−':'')+money(p.amt),esc(p.method),esc(p.ref),esc(usr(p.by)?.name),p.type==='refund'?badge('Refunded'):'Recorded, unverified']}),'No payments recorded yet.')}</div>`}
function expPay(){csv('payments.csv',['Date','Student','Amount','Method','Reference','Type'],db.pays.map(p=>[p.date,sname(stu(db.enrs.find(e=>e.id===p.enr)?.stu)),p.amt,p.method,p.ref,p.type]))}
function recPay(id){if(!guard(can.money()))return;const e=db.enrs.find(x=>x.id===id);
 modal('Record payment',[{k:'type',l:'Type',t:'select',o:[['payment','Payment received'],['refund','Refund issued']]},{k:'amt',l:'Amount (balance: '+money(bal(e))+')',t:'number',req:1},{k:'date',l:'Date',t:'date',req:1},{k:'method',l:'Method',t:'select',o:['Bank Transfer','Card','Cash','Payment Gateway','Other']},{k:'ref',l:'Transaction reference',req:1}],d=>{
  if(d.amt<=0)return'Amount must be above zero.';if(d.date>today())return'Payment date can’t be in the future.';
  if(db.pays.some(p=>p.ref.toLowerCase()===d.ref.toLowerCase()&&p.method===d.method))return'This reference has already been recorded for '+d.method+'. Duplicates are blocked.';
  if(d.type==='payment'&&d.amt>bal(e))return'That’s more than the outstanding balance ('+money(bal(e))+').';
  if(d.type==='refund'&&d.amt>fin(e).paid)return'A refund can’t exceed the amount paid.';
  db.pays.push({id:uid('P'),enr:id,...d,by:me.id});log('Payment '+d.type,money(d.amt)+' · '+d.ref);toast('Recorded (manually entered, not bank-verified)')},{date:today(),type:'payment'})}
function notes(v){const mine=db.notes.filter(n=>n.to==='all'||n.to===me.id||(n.to==='admin'&&me.role==='admin'));
 v.innerHTML=head('Notifications','In-app only. No emails or SMS are sent until a provider is connected.',`<button class="btn g" onclick="mine().forEach(n=>n.read=true);save();render()">Mark all read</button>`)+`<div class="card">${mine.length?mine.map(n=>`<div style="padding:8px 0;border-bottom:1px solid var(--line);${n.read?'color:var(--mut)':'font-weight:600'}">${esc(n.t)}<div class="sub" style="font-size:12px">${new Date(n.at).toLocaleString('en-GB')}</div></div>`).join(''):'<div class="empty">You’re all caught up.</div>'}</div>`;
 window.mine=()=>mine}
function logs(v){if(!guard(can.admin()))return;v.innerHTML=head('Activity Log','Who did what, and when.')+`<div class="card">${table(['When','User','Action','Details'],db.logs.map(l=>[new Date(l.at).toLocaleString('en-GB'),esc(l.by),esc(l.a),esc(l.d)]),'No activity yet.')}</div>`}
boot();
</script></body></html>
